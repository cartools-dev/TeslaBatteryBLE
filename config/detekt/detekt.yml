# Detekt configuration for TeslaBatteryBLE. Complements the default rule set
# (enabled via `buildUponDefaultConfig` in the Gradle `detekt` blocks) at its
# default thresholds. Existing debt lives in `detekt-baseline.xml` next to each
# module's build file and should only shrink; regenerate it with
# `./gradlew detektBaseline` (JDK 21) after fixing findings, never to admit new ones.
style:
  # Aligned with ktlint's 140-column limit: ktlint's function-signature rule
  # requires bodies that fit in 140 columns on one line, so a lower detekt
  # limit would make the two tools contradict each other.
  MaxLineLength:
    maxLineLength: 140

naming:
  # UpperCamelCase is the official convention for @Composable functions.
  # The default test-source excludes are repeated here because specifying
  # `excludes` replaces (rather than extends) the detekt defaults; backtick
  # test names would otherwise be flagged.
  FunctionNaming:
    excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/ui/**']
